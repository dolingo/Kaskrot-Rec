                  }
                  val tvDesc = TextView(this).apply {
                      text = desc
                      setTextColor(Color.parseColor("#8B949E"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 11f)
                  }
                  textCol.addView(tvTitle)
                  textCol.addView(tvDesc)

                  val sw = Switch(this).apply {
                      isChecked = initial
                  }
                  row.addView(textCol)
                  row.addView(sw)
                  parent.addView(row)
                  return sw
              }

              private fun roundedBg(fillHex: String, strokeHex: String, radiusDp: Int, strokeDp: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      cornerRadius = dp(radiusDp).toFloat()
                      setStroke(dp(strokeDp), Color.parseColor(strokeHex))
                  }
              }

              private fun marginParams(bottom: Int): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { bottomMargin = dp(bottom) }
              }

              private fun dp(value: Int): Int =
                  TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value.toFloat(), resources.displayMetrics).toInt()
          }
