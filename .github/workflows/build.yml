                              onSelect(index)
                          }
                      }
                      val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f).apply {
                          setMargins(dp(3), dp(3), dp(3), dp(3))
