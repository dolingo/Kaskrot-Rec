name: Build SuperRecorder A15 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Complete Android Project Files
        run: |
          mkdir -p app/src/main/java/com/superrecorder/a15

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SuperRecorderA15"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.superrecorder.a15'
              compileSdk 34

              defaultConfig {
                  applicationId "com.superrecorder.a15"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0-A15Pro"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="Super Recorder A15"
                  android:icon="@android:drawable/presence_video_online"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RecorderService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/superrecorder/a15/RecordingConfig.kt
          package com.superrecorder.a15

          import android.content.Context
          import android.content.SharedPreferences

          data class RecordingSettings(
              val mode: Int,
              val resolutionIndex: Int,
              val bitrateMbps: Int,
              val fps: Int,
              val enableMic: Boolean,
              val showFloating: Boolean,
              val enableBrush: Boolean,
              val shakeToStop: Boolean,
              val stopOnScreenOff: Boolean,
              val countdownSec: Int,
              val regionLeft: Int,
              val regionTop: Int,
              val regionWidth: Int,
              val regionHeight: Int
          )

          object PrefsManager {
              private const val PREFS_NAME = "super_recorder_a15_prefs"

              private fun prefs(context: Context): SharedPreferences =
                  context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun saveSettings(context: Context, s: RecordingSettings) {
                  prefs(context).edit().apply {
                      putInt("mode", s.mode)
                      putInt("res", s.resolutionIndex)
                      putInt("bitrate", s.bitrateMbps)
                      putInt("fps", s.fps)
                      putBoolean("mic", s.enableMic)
                      putBoolean("floating", s.showFloating)
                      putBoolean("brush", s.enableBrush)
                      putBoolean("shake", s.shakeToStop)
                      putBoolean("screen_off", s.stopOnScreenOff)
                      putInt("countdown", s.countdownSec)
                      putInt("r_left", s.regionLeft)
                      putInt("r_top", s.regionTop)
                      putInt("r_width", s.regionWidth)
                      putInt("r_height", s.regionHeight)
                      apply()
                  }
              }

              fun loadSettings(context: Context): RecordingSettings {
                  val p = prefs(context)
                  return RecordingSettings(
                      mode = p.getInt("mode", 0),
                      resolutionIndex = p.getInt("res", 0),
                      bitrateMbps = p.getInt("bitrate", 12),
                      fps = p.getInt("fps", 60),
                      enableMic = p.getBoolean("mic", true),
                      showFloating = p.getBoolean("floating", true),
                      enableBrush = p.getBoolean("brush", true),
                      shakeToStop = p.getBoolean("shake", true),
                      stopOnScreenOff = p.getBoolean("screen_off", true),
                      countdownSec = p.getInt("countdown", 3),
                      regionLeft = p.getInt("r_left", 140),
                      regionTop = p.getInt("r_top", 400),
                      regionWidth = p.getInt("r_width", 800),
                      regionHeight = p.getInt("r_height", 1000)
                  )
              }

              fun align16(value: Int): Int {
                  val aligned = (value / 16) * 16
                  return if (aligned < 160) 160 else aligned
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/superrecorder/a15/MainActivity.kt
          package com.superrecorder.a15

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.util.TypedValue
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.*
          import kotlin.math.hypot

          class MainActivity : Activity() {

              private lateinit var projectionManager: MediaProjectionManager
              private lateinit var settings: RecordingSettings

              private var selectedMode = 0
              private var selectedRes = 0
              private var selectedBitrate = 12
              private var selectedFps = 60
              private var selectedCountdown = 3

              private lateinit var swMic: Switch
              private lateinit var swFloating: Switch
              private lateinit var swBrush: Switch
              private lateinit var swShake: Switch
              private lateinit var swScreenOff: Switch
              private lateinit var tvRegionInfo: TextView
              private lateinit var btnSelectRegion: Button

              private var regionOverlayView: View? = null

              companion object {
                  private const val REQ_MEDIA_PROJECTION = 1001
                  private const val REQ_PERMISSIONS = 1002
                  private const val REQ_OVERLAY = 1003
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  settings = PrefsManager.loadSettings(this)

                  selectedMode = settings.mode
                  selectedRes = settings.resolutionIndex
                  selectedBitrate = settings.bitrateMbps
                  selectedFps = settings.fps
                  selectedCountdown = settings.countdownSec

                  window.statusBarColor = Color.parseColor("#0D1117")
                  window.navigationBarColor = Color.parseColor("#0D1117")

                  setContentView(buildDashboardUI())
              }

              private fun buildDashboardUI(): View {
                  val rootScroll = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#0D1117"))
                      isFillViewport = true
                  }

                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(20), dp(18), dp(30))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = roundedBg("#161B22", "#FF6B00", 18, 2)
                      setPadding(dp(20), dp(20), dp(20), dp(20))
                  }
                  val title = TextView(this).apply {
                      text = "SUPER RECORDER PRO"
                      setTextColor(Color.parseColor("#FF7B00"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 22f)
                      paint.isFakeBoldText = true
                      gravity = Gravity.CENTER
                  }
                  val subTitle = TextView(this).apply {
                      text = "نسخة مخصصة لهاتف Samsung Galaxy A15 4G (19.5:9 • 90Hz)"
                      setTextColor(Color.parseColor("#8B949E"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 12f)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, 0)
                  }
                  header.addView(title)
                  header.addView(subTitle)
                  container.addView(header, marginParams(bottom = 16))

                  val modeCard = createSectionCard("1. وضع التصوير (3 أنماط)")
                  val modeLabels = listOf(
                      "عمودي (Portrait)\nلواجهة الهاتف",
                      "أفقي (Landscape)\nمخصص للألعاب",
                      "جزء من الشاشة\nPart of Screen"
                  )
                  modeCard.addView(createSegmentedButtons(modeLabels, selectedMode) { index ->
                      selectedMode = index
                      btnSelectRegion.visibility = if (index == 2) View.VISIBLE else View.GONE
                      tvRegionInfo.visibility = if (index == 2) View.VISIBLE else View.GONE
                  })

                  tvRegionInfo = TextView(this).apply {
                      text = "المنطقة المحددة: ${settings.regionWidth} × ${settings.regionHeight} بكسل"
                      setTextColor(Color.parseColor("#58A6FF"))
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                      setPadding(0, dp(10), 0, dp(6))
                      visibility = if (selectedMode == 2) View.VISIBLE else View.GONE
                  }
                  btnSelectRegion = Button(this).apply {
                      text = "تحديد إطار المنطقة على الشاشة الآن"
                      setTextColor(Color.WHITE)
                      background = roundedBg("#1F6FEB", "#58A6FF", 12, 1)
                      visibility = if (selectedMode == 2) View.VISIBLE else View.GONE
                      setOnClickListener { openInteractiveRegionSelector() }
                  }
                  modeCard.addView(tvRegionInfo)
                  modeCard.addView(btnSelectRegion)
                  container.addView(modeCard, marginParams(bottom = 14))

                  val videoCard = createSectionCard("2. إعدادات الفيديو (Resolution • Quality • FPS)")

                  videoCard.addView(createLabel("دقة الفيديو (Video Resolution):"))
                  val resOptions = listOf("1080p FHD\n(1080×2340)", "720p HD\n(720×1560)", "480p SD\n(480×1040)")
                  videoCard.addView(createSegmentedButtons(resOptions, selectedRes) { selectedRes = it })

                  videoCard.addView(createLabel("جودة الفيديو (Video Quality):"))
                  val bitrateValues = listOf(16, 12, 8, 4, 2)
                  val bitrateLabels = listOf("16M\nفائقة", "12M\nعالية+", "8M\nعالية", "4M\nمتوسطة", "2M\nاقتصادية")
                  val initialBitrateIdx = bitrateValues.indexOf(selectedBitrate).coerceAtLeast(0)
                  videoCard.addView(createSegmentedButtons(bitrateLabels, initialBitrateIdx) {
                      selectedBitrate = bitrateValues[it]
                  })

                  videoCard.addView(createLabel("معدل الإطارات (FPS):"))
                  val fpsValues = listOf(90, 60, 30, 24)
                  val fpsLabels = listOf("90 FPS\nسلاسة A15", "60 FPS\nللألعاب", "30 FPS\nقياسي", "24 FPS\nسينمائي")
                  val initialFpsIdx = fpsValues.indexOf(selectedFps).coerceAtLeast(0)
                  videoCard.addView(createSegmentedButtons(fpsLabels, initialFpsIdx) {
                      selectedFps = fpsValues[it]
                  })

                  container.addView(videoCard, marginParams(bottom = 14))

                  val countdownCard = createSectionCard("3. العد التنازلي قبل البدء")
                  val cdValues = listOf(0, 3, 5, 10)
                  val cdLabels = listOf("فوري (0s)", "3 ثوانٍ", "5 ثوانٍ", "10 ثوانٍ")
                  val initialCdIdx = cdValues.indexOf(selectedCountdown).coerceAtLeast(0)
                  countdownCard.addView(createSegmentedButtons(cdLabels, initialCdIdx) {
                      selectedCountdown = cdValues[it]
                  })
                  container.addView(countdownCard, marginParams(bottom = 14))

                  val proCard = createSectionCard("4. الخيارات والميزات الاحترافية")

                  swMic = createToggleRow(
                      proCard,
                      "تسجيل صوت المايكروفون (Microphone)",
                      "تفعيل أو كتم صوتك الخارجي أثناء تصوير الشاشة",
                      settings.enableMic
                  )
                  swFloating = createToggleRow(
                      proCard,
                      "إظهار النافذة العائمة (Floating Window)",
                      "إلغاء التفعيل يخفي الكرة العائمة تماماً أثناء التصوير",
                      settings.showFloating
                  )
                  swBrush = createToggleRow(
                      proCard,
                      "تفعيل أداة الفرشاة والرسم (Screen Brush)",
                      "إضافة زر للرسم والتأشير المباشر على الشاشة أثناء الشرح",
                      settings.enableBrush
                  )
                  swShake = createToggleRow(
                      proCard,
                      "هز الهاتف لإيقاف التسجيل (Shake to Stop)",
                      "إنهاء وحفظ الفيديو فوراً بمجرد هز الهاتف",
                      settings.shakeToStop
                  )
                  swScreenOff = createToggleRow(
                      proCard,
                      "إيقاف وحفظ تلقائي عند قفل الشاشة",
                      "حفظ التسجيل تلقائياً بمجرد إغلاق شاشة الهاتف",
                      settings.stopOnScreenOff
                  )

                  container.addView(proCard, marginParams(bottom = 20))

                  val btnStart = Button(this).apply {
                      text = "●  بدء تصوير الشاشة الآن"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 17f)
                      paint.isFakeBoldText = true
                      background = roundedBg("#FF6B00", "#FFA657", 16, 2)
                      setPadding(0, dp(16), 0, dp(16))
                      setOnClickListener { checkPermissionsAndStart() }
                  }
                  container.addView(btnStart, marginParams(bottom = 12))

                  val btnStopService = Button(this).apply {
                      text = "■  إيقاف التسجيل الحالي وحفظ الفيديو"
                      setTextColor(Color.WHITE)
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, 14f)
                      background = roundedBg("#21262D", "#F85149", 14, 1)
                      setPadding(0, dp(14), 0, dp(14))
                      setOnClickListener {
                          val stopIntent = Intent(this@MainActivity, RecorderService::class.java).apply {
                              action = RecorderService.ACTION_STOP
                          }
                          startService(stopIntent)
                      }
                  }
                  container.addView(btnStopService)

                  rootScroll.addView(container)
                  return rootScroll
              }

              private fun openInteractiveRegionSelector() {
                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "يرجى منح إذن الظهور فوق التطبيقات أولاً", Toast.LENGTH_LONG).show()
                      startActivityForResult(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")),
                          REQ_OVERLAY
                      )
                      return
                  }
                  if (regionOverlayView != null) return

                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val dm = resources.displayMetrics

                  var boxLeft = settings.regionLeft.toFloat()
                  var boxTop = settings.regionTop.toFloat()
                  var boxRight = (settings.regionLeft + settings.regionWidth).toFloat()
                  var boxBottom = (settings.regionTop + settings.regionHeight).toFloat()

                  val selectorView = object : FrameLayout(this) {
                      private val dimPaint = Paint().apply { color = Color.argb(150, 0, 0, 0) }
                      private val clearPaint = Paint().apply {
                          color = Color.TRANSPARENT
                          xfermode = PorterDuffXfermode(PorterDuff.Mode.CLEAR)
                      }
                      private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.parseColor("#FF7B00")
                          style = Paint.Style.STROKE
                          strokeWidth = dp(3).toFloat()
                      }
                      private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          style = Paint.Style.FILL
                      }
                      private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                          color = Color.WHITE
                          textSize = dp(14).toFloat()
                          isFakeBoldText = true
                      }

                      private var dragMode = 0
                      private var lastX = 0f
                      private var lastY = 0f

                      init {
                          setWillNotDraw(false)
                          setLayerType(LAYER_TYPE_SOFTWARE, null)
                      }

                      override fun onDraw(canvas: Canvas) {
                          super.onDraw(canvas)
                          canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), dimPaint)
                          canvas.drawRect(boxLeft, boxTop, boxRight, boxBottom, clearPaint)
                          canvas.drawRect(boxLeft, boxTop, boxRight, boxBottom, borderPaint)

                          val r = dp(10).toFloat()
                          canvas.drawCircle(boxLeft, boxTop, r, handlePaint)
                          canvas.drawCircle(boxRight, boxBottom, r, handlePaint)

                          val w = PrefsManager.align16((boxRight - boxLeft).toInt())
                          val h = PrefsManager.align16((boxBottom - boxTop).toInt())
                          canvas.drawText(
                              "منطقة التصوير: $w × $h",
                              boxLeft + dp(10),
                              (boxTop - dp(12)).coerceAtLeast(dp(30).toFloat()),
                              textPaint
                          )
                      }

                      override fun onTouchEvent(event: MotionEvent): Boolean {
                          val x = event.x
                          val y = event.y
                          val touchRadius = dp(40).toFloat()

                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  lastX = x
                                  lastY = y
                                  dragMode = when {
                                      hypot((x - boxRight).toDouble(), (y - boxBottom).toDouble()) < touchRadius -> 2
                                      hypot((x - boxLeft).toDouble(), (y - boxTop).toDouble()) < touchRadius -> 3
                                      x in boxLeft..boxRight && y in boxTop..boxBottom -> 1
                                      else -> 0
                                  }
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = x - lastX
                                  val dy = y - lastY
                                  when (dragMode) {
                                      1 -> {
                                          val bw = boxRight - boxLeft
                                          val bh = boxBottom - boxTop
                                          boxLeft = (boxLeft + dx).coerceIn(0f, dm.widthPixels - bw)
                                          boxTop = (boxTop + dy).coerceIn(0f, dm.heightPixels - bh)
                                          boxRight = boxLeft + bw
                                          boxBottom = boxTop + bh
                                      }
                                      2 -> {
                                          boxRight = (boxRight + dx).coerceIn(boxLeft + dp(120), dm.widthPixels.toFloat())
                                          boxBottom = (boxBottom + dy).coerceIn(boxTop + dp(120), dm.heightPixels.toFloat())
                                      }
                                      3 -> {
                                          boxLeft = (boxLeft + dx).coerceIn(0f, boxRight - dp(120))
                                          boxTop = (boxTop + dy).coerceIn(0f, boxBottom - dp(120))
                                      }
                                  }
                                  lastX = x
                                  lastY = y
                                  invalidate()
                                  return true
                              }
                              MotionEvent.ACTION_UP -> dragMode = 0
                          }
                          return super.onTouchEvent(event)
                      }
                  }

                  val btnConfirm = Button(this).apply {
                      text = "✓ اعتماد هذه المنطقة"
                      setTextColor(Color.WHITE)
                      background = roundedBg("#238636", "#2EA043", 12, 2)
                      setPadding(dp(20), dp(12), dp(20), dp(12))
                      setOnClickListener {
                          val alignedW = PrefsManager.align16((boxRight - boxLeft).toInt())
                          val alignedH = PrefsManager.align16((boxBottom - boxTop).toInt())
                          settings = settings.copy(
                              regionLeft = boxLeft.toInt(),
                              regionTop = boxTop.toInt(),
                              regionWidth = alignedW,
                              regionHeight = alignedH
                          )
                          PrefsManager.saveSettings(this@MainActivity, settings)
                          tvRegionInfo.text = "المنطقة المحددة: $alignedW × $alignedH بكسل"
                          wm.removeView(regionOverlayView)
                          regionOverlayView = null
                      }
                  }

                  val lpBtn = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      bottomMargin = dp(45)
                  }
                  selectorView.addView(btnConfirm, lpBtn)

                  val overlayParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )

                  regionOverlayView = selectorView
                  wm.addView(selectorView, overlayParams)
              }

              private fun saveCurrentStateToPrefs() {
                  settings = settings.copy(
                      mode = selectedMode,
                      resolutionIndex = selectedRes,
                      bitrateMbps = selectedBitrate,
                      fps = selectedFps,
                      enableMic = swMic.isChecked,
                      showFloating = swFloating.isChecked,
                      enableBrush = swBrush.isChecked,
                      shakeToStop = swShake.isChecked,
                      stopOnScreenOff = swScreenOff.isChecked,
                      countdownSec = selectedCountdown
                  )
                  PrefsManager.saveSettings(this, settings)
              }

              private fun checkPermissionsAndStart() {
                  saveCurrentStateToPrefs()

                  val needsOverlay = settings.showFloating || settings.enableBrush || settings.countdownSec > 0 || settings.mode == 2
                  if (needsOverlay && !Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, "يرجى تفعيل إذن الظهور فوق التطبيقات", Toast.LENGTH_LONG).show()
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      startActivityForResult(intent, REQ_OVERLAY)
                      return
                  }

                  val neededPerms = mutableListOf<String>()
                  if (settings.enableMic && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      neededPerms.add(Manifest.permission.RECORD_AUDIO)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      neededPerms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  if (neededPerms.isNotEmpty()) {
                      requestPermissions(neededPerms.toTypedArray(), REQ_PERMISSIONS)
                      return
                  }

                  requestScreenCapture()
              }

              private fun requestScreenCapture() {
                  startActivityForResult(projectionManager.createScreenCaptureIntent(), REQ_MEDIA_PROJECTION)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == REQ_PERMISSIONS) {
                      requestScreenCapture()
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_OVERLAY) {
                      checkPermissionsAndStart()
                  } else if (requestCode == REQ_MEDIA_PROJECTION && resultCode == RESULT_OK && data != null) {
                      val serviceIntent = Intent(this, RecorderService::class.java).apply {
                          action = RecorderService.ACTION_START
                          putExtra(RecorderService.EXTRA_RESULT_CODE, resultCode)
                          putExtra(RecorderService.EXTRA_RESULT_DATA, data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }
                      moveTaskToBack(true)
                  }
              }

              private fun createSectionCard(titleText: String): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = roundedBg("#161B22", "#30363D", 14, 1)
                      setPadding(dp(16), dp(14), dp(16), dp(16))
                      val header = TextView(this@MainActivity).apply {
                          text = titleText
                          setTextColor(Color.parseColor("#F0F6FC"))
                          setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
                          paint.isFakeBoldText = true
